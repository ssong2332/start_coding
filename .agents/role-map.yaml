# role-map.yaml — Role(무엇을) ↔ Provider(누가 실행하는가) 매핑
#
# 소유자: 사용자. scripts/pipeline.ps1이 이 파일을 읽어 각 role을 어느 CLI로 실행할지 결정한다.
# provider를 바꾸고 싶으면 이 파일의 매핑 값만 고친다 — .agents/roles/*.role.md(역할 정의)나
# scripts/pipeline.ps1(오케스트레이션 로직)은 건드리지 않는다.
#
# 사람 승인 게이트(PRD 승인·Architecture 승인·최종 완료 승인)는 provider와 무관하게
# 항상 사람이 한다 — 이 매핑은 "그 사이 자동 실행 구간"에만 적용된다.

roles:
  planner: claude
  architect: antigravity
  implementer: codex
  reviewer: antigravity
  qa: codex
  docs: antigravity

# 각 provider의 실행 방법. 2026-09-08 실측 검증됨 — 원문 그대로 재사용한다(AGENTS.md "명령어는 검증된 원문 재사용").
# {prompt}는 pipeline.ps1이 role.md + AGENTS.md 참조 + 관련 docs 경로를 조합해 채운다.
providers:
  claude:
    command: claude
    # auto: 파일 편집 + Bash 실행 모두 자동 승인. 2026-09-08 실측: acceptEdits는 Bash 실행을 승인 안 해
    # reviewer·qa role의 "직접 재실행해 검증" 절차가 막힘(파이프라인 테스트에서 실제로 발생) — auto로 교체.
    # bypassPermissions는 시도하지 않음(더 넓은 우회로 보여 필요성 확인 전에는 안 씀).
    args: ["-p", "--permission-mode", "auto"]
    risk: 낮음 — 파일 편집·Bash 둘 다 자동이나 workspace 범위(cwd) 내로 동작, bypassPermissions보다 좁음

  codex:
    command: codex
    args: ["exec", "--approve-for-me"]
    # --approve-for-me: workspace-write 샌드박스 내 자동 승인 (danger 계열 아님) — 2026-09-08 codex-pilot-test 파일럿으로 실증
    risk: 낮음 — workspace-write 샌드박스 범위 내로 한정됨

  antigravity:
    command: agy
    args: ["--dangerously-skip-permissions", "-p"]
    # 2026-09-08 실측: --mode accept-edits만으로는 read_file조차 자동 거부됨(헤드리스 모드가 permissions.allow를 무시하는
    # 알려진 버그, google-antigravity/antigravity-cli#548). 범위 한정된 승인 옵션이 없어 전체 우회 플래그가 사실상 유일한 선택지.
    # 2026-09-09 실측: -p를 먼저 두면 agy가 다음 토큰(--dangerously-skip-permissions)을 프롬프트로 오인해 진짜 프롬프트를
    # 무시한다("-p took ... as its prompt" 에러) — pipeline.ps1이 프롬프트를 args 맨 뒤에 붙이므로 -p가 항상 마지막이어야 한다.
    risk: 높음 — 전체 권한 우회, 범위 한정 옵션 없음. pipeline.ps1은 이 provider를 쓰는 role마다 사람 확인을 한 번 더 요구한다
